spring.application.name=UTEGear
spring.profiles.default=local

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.expiration=${JWT_EXPIRATION:86400000}

cloudinary.folder=${CLOUDINARY_FOLDER:utegear}
cloudinary.max-file-size=${CLOUDINARY_MAX_FILE_SIZE:5242880}
spring.servlet.multipart.max-file-size=${CLOUDINARY_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${CLOUDINARY_MAX_FILE_SIZE:5MB}
crawler.import.allowed-image-hosts=${CRAWLER_IMPORT_ALLOWED_IMAGE_HOSTS:product.hstatic.net,res.cloudinary.com}
crawler.import.max-rows=${CRAWLER_IMPORT_MAX_ROWS:1000}
app.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:8080}

# Mail Configuration (SMTP Gmail)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:no-reply@utegear.vn}
app.mail.dev-mode=${MAIL_DEV_MODE:true}
