<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<form th:fragment="filterForm(isMobile)"
      th:id="${isMobile} ? 'mobileFilterForm' : 'filterSidebar'"
      th:class="${isMobile} ? '' : 'filter-sidebar'"
      method="get"
      th:action="${categoryBaseUrl != null ? categoryBaseUrl : '/products'}">
    <input type="hidden" name="sort" th:value="${sort != null ? sort : 'createdAt,desc'}">
    <input type="hidden" name="q" th:if="${keyword != null && !#strings.isEmpty(keyword)}" th:value="${keyword}">

    <div th:unless="${isMobile}" class="filter-title">
        <span><i class="bi bi-funnel text-primary me-1"></i> Bộ lọc sản phẩm</span>
        <a th:if="${selectedCategoryId != null || selectedBrandId != null || selectedMinPrice != null || selectedMaxPrice != null || selectedOnSale == true}"
           th:href="${categoryBaseUrl != null ? categoryBaseUrl : '/products'}"
           class="btn-filter-reset" title="Đặt lại bộ lọc"><i class="bi bi-arrow-counterclockwise"></i> Đặt lại</a>
    </div>

    <div class="filter-group">
        <div class="filter-group-header"><i class="bi bi-grid"></i><span>Danh mục</span></div>
        <div class="filter-options-list">
            <a th:href="@{/products}" class="filter-link-option" th:classappend="${currentCategory == null && selectedCategoryId == null} ? 'active'">Tất cả sản phẩm</a>
            <a th:each="category : ${allCategories}"
               th:href="@{'/category/' + ${category.slug}}"
               th:text="${category.name}"
               class="filter-link-option"
               th:classappend="${currentCategory != null && currentCategory.id == category.id} ? 'active'">Danh mục</a>
        </div>
    </div>

    <div class="filter-group">
        <div class="filter-group-header"><i class="bi bi-award"></i><span>Thương hiệu</span></div>
        <div class="filter-options-list">
            <label class="filter-check-item"><input type="radio" name="brandId" value="" th:checked="${selectedBrandId == null}"><span>Tất cả thương hiệu</span></label>
            <label th:each="brand : ${allBrands}" class="filter-check-item"><input type="radio" name="brandId" th:value="${brand.id}" th:checked="${selectedBrandId == brand.id}"><span th:text="${brand.name}">Thương hiệu</span></label>
        </div>
    </div>

    <div class="filter-group">
        <div class="filter-group-header"><i class="bi bi-cash-stack"></i><span>Khoảng giá</span></div>
        <div class="price-inputs-row">
            <div class="price-input-wrapper"><label th:for="${isMobile} ? 'mobileMinPriceInput' : 'minPriceInput'">Từ</label><input type="number" th:id="${isMobile} ? 'mobileMinPriceInput' : 'minPriceInput'" name="minPrice" min="0" step="50000" th:value="${selectedMinPrice}" placeholder="0"></div>
            <span class="price-hyphen">-</span>
            <div class="price-input-wrapper"><label th:for="${isMobile} ? 'mobileMaxPriceInput' : 'maxPriceInput'">Đến</label><input type="number" th:id="${isMobile} ? 'mobileMaxPriceInput' : 'maxPriceInput'" name="maxPrice" min="0" step="50000" th:value="${selectedMaxPrice}" placeholder="15000000"></div>
        </div>
    </div>

    <div class="filter-group">
        <div class="filter-group-header"><i class="bi bi-percent"></i><span>Khuyến mãi</span></div>
        <label class="filter-check-item"><input type="checkbox" name="onSale" value="true" th:checked="${selectedOnSale == true}"><span>Đang giảm giá</span></label>
    </div>

    <div class="filter-sidebar-actions">
        <button type="submit" class="btn-filter-apply"><i class="bi bi-funnel me-1"></i> Áp dụng bộ lọc</button>
        <a th:href="${categoryBaseUrl != null ? categoryBaseUrl : '/products'}" class="btn-filter-reset"><i class="bi bi-arrow-counterclockwise"></i> Xóa bộ lọc</a>
    </div>
</form>
</body>
</html>
