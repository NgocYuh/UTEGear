<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  UTEGear Canonical Product Card Fragment
  UTEGear Standard Product Card Fragment
  Expects: 'p' (Product entity or projection)
-->
<div th:fragment="productCard(p)" class="product-card"
     th:classappend="${p.outOfStock()} ? 'is-out-of-stock' : (${p.isLowStock()} ? 'is-low-stock' : '')"
     th:attr="data-product-id=${p.id}">
    <div class="product-card-inner">

        <!-- 1. Product Media Area -->
        <div class="product-image">
            <a th:href="@{'/products/' + ${p.id}}" class="product-image-link"
               th:aria-label="${p.name}">
                <img th:src="${p.imageUrl != null ? p.imageUrl : '/images/placeholder.png'}"
                     th:alt="${p.name}" loading="lazy" decoding="async"
                     onerror="this.src='/images/placeholder.png'">
            </a>

            <!-- State & Discount Badges (Asymmetric top-left) -->
            <div class="product-badges" aria-label="Nhãn sản phẩm">
                <span class="badge-discount" th:if="${p.hasDiscount()}"
                      th:text="'-' + ${p.discountPercent} + '%'">-20%</span>
                <span class="badge-stock badge-stock-out" th:if="${p.outOfStock()}">Hết hàng</span>
                <span class="badge-stock badge-stock-low" th:if="${!p.outOfStock() && p.isLowStock()}">Sắp hết</span>
            </div>

            <!-- Quick Action Floating Buttons (Wishlist & Quick View top-right) -->
            <div class="product-actions">
                <button type="button" class="action-btn-icon wishlist-btn"
                        th:attr="data-product-id=${p.id}"
                        th:onclick="'toggleWishlist(' + ${p.id} + ')'"
                        aria-label="Thêm vào danh sách yêu thích"
                        th:title="'Thêm vào yêu thích'">
                    <i class="bi bi-heart"></i>
                </button>
                <button type="button" class="action-btn-icon quickview-btn"
                        th:attr="data-product-id=${p.id}"
                        th:onclick="'quickView(' + ${p.id} + ')'"
                        data-bs-toggle="modal" data-bs-target="#quickViewModal"
                        aria-label="Xem thông tin nhanh"
                        th:title="'Xem nhanh'">
                    <i class="bi bi-eye"></i>
                </button>
            </div>
        </div>

        <!-- 2. Product Meta & Content Info -->
        <div class="product-info">

            <!-- Brand & Category Tag (Clean asymmetry) -->
            <div class="product-meta-row">
                <span class="product-brand" th:text="${p.brand != null ? p.brand.name : 'UTEGear'}">Brand</span>
                <span class="product-category-tag" th:if="${p.category != null}"
                      th:text="${@categoryHelper.getDisplayCategoryName(p.category)}">Danh mục</span>
            </div>

            <!-- Product Title (2-line clamped) -->
            <h3 class="product-title-heading">
                <a class="product-name" th:href="@{'/products/' + ${p.id}}"
                   th:text="${p.name}" th:title="${p.name}">Tên sản phẩm</a>
            </h3>

            <!-- Star Rating & Review Count -->
            <div class="product-rating" th:aria-label="'Đánh giá ' + ${#numbers.formatDecimal(p.rating, 1, 1)} + ' sao trên ' + ${p.reviewCount} + ' nhận xét'">
                <span class="stars" aria-hidden="true">
                    <i class="bi bi-star-fill text-warning" th:each="star : ${#numbers.sequence(1, 5)}"
                       th:classappend="${star <= p.rating} ? 'text-warning' : 'text-secondary opacity-25'"></i>
                </span>
                <span class="rating-value" th:text="${#numbers.formatDecimal(p.rating, 1, 1)}">4.8</span>
                <span class="review-count" th:text="'(' + ${p.reviewCount} + ')'">(125)</span>
            </div>

            <!-- Pricing Area: Sale Price > Original Price -->
            <div class="product-price">
                <th:block th:if="${p.hasDiscount()}">
                    <span class="price-sale" th:text="${@priceFormatter.format(p.salePrice)}">2.490.000 ₫</span>
                    <span class="price-original" th:text="${@priceFormatter.format(p.price)}">2.990.000 ₫</span>
                </th:block>
                <th:block th:unless="${p.hasDiscount()}">
                    <span class="price-sale" th:text="${@priceFormatter.format(p.price)}">2.490.000 ₫</span>
                </th:block>
            </div>

            <!-- Stock State Urgency Line -->
            <div class="product-stock-status">
                <span class="stock-text stock-out" th:if="${p.outOfStock()}">
                    <i class="bi bi-x-circle-fill"></i> Tạm hết hàng
                </span>
                <span class="stock-text stock-low" th:if="${!p.outOfStock() && p.isLowStock()}">
                    <i class="bi bi-exclamation-triangle-fill"></i> Chỉ còn <span th:text="${p.stock}">2</span> sản phẩm
                </span>
                <span class="stock-text stock-available" th:if="${!p.outOfStock() && !p.isLowStock()}">
                    <i class="bi bi-check2"></i> Có sẵn tại cửa hàng
                </span>
            </div>

            <!-- 3. Primary Purchase Action Area (Single unified button) -->
            <div class="product-card-actions">
                <button type="button" class="btn-card-add"
                        th:attr="data-product-id=${p.id}"
                        th:onclick="'addToCart(' + ${p.id} + ')'"
                        th:disabled="${p.outOfStock()}"
                        th:aria-label="${p.outOfStock()} ? 'Sản phẩm tạm hết hàng' : 'Thêm ' + ${p.name} + ' vào giỏ hàng'">
                    <i class="bi" th:classappend="${p.outOfStock()} ? 'bi-slash-circle' : 'bi-cart-plus'"></i>
                    <span th:text="${p.outOfStock()} ? 'Tạm hết hàng' : 'Thêm vào giỏ'">Thêm vào giỏ</span>
                </button>
            </div>

        </div>
    </div>
</div>

</body>
</html>
