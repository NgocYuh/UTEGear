<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="widget">
  <section class="support-chat" aria-label="Hỗ trợ khách hàng">
    <button class="support-chat__trigger" type="button" aria-expanded="false" aria-controls="support-chat-panel" aria-label="Mở chat hỗ trợ UTEGear">
      <i class="bi bi-headset" aria-hidden="true"></i><span class="support-chat__signal" aria-hidden="true"></span>
    </button>
    <div id="support-chat-panel" class="support-chat__panel" hidden role="dialog" aria-modal="false" aria-labelledby="support-chat-title">
      <header class="support-chat__header"><div><p class="support-chat__eyebrow">UTEGEAR SUPPORT</p><h2 id="support-chat-title">Hỗ trợ trực tuyến</h2><span id="support-chat-state">Chọn cửa hàng để bắt đầu</span></div><button type="button" class="support-chat__close" aria-label="Đóng chat"><i class="bi bi-x-lg"></i></button></header>
      <div class="support-chat__body"><label for="support-store">Chi nhánh hỗ trợ</label><select id="support-store" class="form-select"><option value="">Chọn chi nhánh</option></select><a id="support-chat-access" href="/login" class="mt-2">Đăng nhập để chat với nhân viên</a><div id="support-chat-messages" class="support-chat__messages" aria-live="polite"><p class="support-chat__empty">Đăng nhập để nhắn trực tiếp với nhân viên cửa hàng.</p></div></div>
      <form id="support-chat-form" class="support-chat__composer"><label class="visually-hidden" for="support-chat-input">Nội dung tin nhắn</label><textarea id="support-chat-input" maxlength="2000" rows="2" placeholder="Nhập tin nhắn..." disabled></textarea><button type="submit" class="btn btn-danger" disabled><i class="bi bi-send"></i><span>Gửi</span></button></form>
    </div>
  </section>
</th:block>
