<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/admin}">
<head><title>Quản lý mã giảm giá - UTEGear</title></head>
<body>
<main layout:fragment="content" class="admin-content-wrapper" data-admin-page="coupons">
    <header class="admin-page-header"><div class="admin-page-header-info"><h1 class="admin-page-title">Mã giảm giá</h1><p class="admin-page-subtitle">Thiết lập điều kiện, thời hạn và giới hạn sử dụng.</p></div></header>
    <p data-admin-status role="status" aria-live="polite">Đang tải mã giảm giá…</p>
    <section class="admin-panel"><h2 class="admin-panel-title">Thêm hoặc chỉnh sửa mã</h2>
        <form data-admin-form="coupons" class="row g-3 mt-1"><input type="hidden" name="id">
            <div class="col-md-3"><label class="form-label" for="coupon-code">Mã</label><input class="form-control" id="coupon-code" name="code" maxlength="50" required></div>
            <div class="col-md-3"><label class="form-label" for="coupon-type">Loại giảm</label><select class="form-select" id="coupon-type" name="discountType"><option value="PERCENTAGE">Phần trăm</option><option value="FIXED_AMOUNT">Số tiền</option></select></div>
            <div class="col-md-3"><label class="form-label" for="coupon-value">Giá trị giảm</label><input class="form-control" id="coupon-value" name="discountValue" type="number" min="0" step="0.01" required></div>
            <div class="col-md-3"><label class="form-label" for="coupon-minimum">Đơn tối thiểu</label><input class="form-control" id="coupon-minimum" name="minimumOrderValue" type="number" min="0" step="0.01" value="0"></div>
            <div class="col-md-3"><label class="form-label" for="coupon-maximum">Giảm tối đa</label><input class="form-control" id="coupon-maximum" name="maximumDiscount" type="number" min="0" step="0.01"></div>
            <div class="col-md-3"><label class="form-label" for="coupon-from">Bắt đầu</label><input class="form-control" id="coupon-from" name="validFrom" type="datetime-local" required></div>
            <div class="col-md-3"><label class="form-label" for="coupon-until">Kết thúc</label><input class="form-control" id="coupon-until" name="validUntil" type="datetime-local" required></div>
            <div class="col-md-2"><label class="form-label" for="coupon-max-uses">Lượt dùng</label><input class="form-control" id="coupon-max-uses" name="maxUses" type="number" min="0" value="0" required></div>
            <div class="col-md-1 d-flex align-items-end"><div class="form-check mb-2"><input class="form-check-input" id="coupon-active" name="active" type="checkbox" checked><label class="form-check-label" for="coupon-active">Bật</label></div></div>
            <div class="col-12 d-flex gap-2"><button class="btn-admin-primary" type="submit">Lưu mã</button><button class="btn-admin-secondary" type="reset" data-admin-reset>Nhập mới</button></div>
        </form>
    </section>
    <section class="admin-panel"><div class="admin-table-container"><table class="admin-table"><thead><tr><th>Mã</th><th>Mức giảm</th><th>Điều kiện</th><th>Hiệu lực</th><th>Đã dùng</th><th>Trạng thái</th><th class="text-end">Thao tác</th></tr></thead><tbody data-admin-rows></tbody></table></div><p data-admin-empty hidden>Chưa có mã giảm giá. Hãy tạo mã đầu tiên ở biểu mẫu phía trên.</p></section>
</main>
</body>
</html>
