<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/admin}">
<head><title>Quản lý đơn hàng - UTEGear</title></head>
<body>
<main layout:fragment="content" class="admin-content-wrapper">
    <section data-orders-view="admin">
        <header class="admin-page-header"><div class="admin-page-header-info"><h1 class="admin-page-title">Đơn hàng</h1><p class="admin-page-subtitle">Theo dõi và cập nhật trạng thái đơn theo đúng luồng xử lý.</p></div></header>
        <p data-view-status role="status" aria-live="polite">Đang tải đơn hàng…</p>
        <p data-realtime-status role="status" aria-live="polite"></p>
        <label for="admin-order-filter" class="form-label">Trạng thái</label>
        <select id="admin-order-filter" data-order-filter class="form-select mb-3"><option value="">Tất cả</option><option>PENDING</option><option>CONFIRMED</option><option>PROCESSING</option><option>SHIPPING</option><option>COMPLETED</option><option>CANCELLED</option></select>
        <div data-view-items></div>
        <nav data-order-pagination aria-label="Phân trang" class="d-flex gap-2"></nav>
        <section data-order-detail class="surface-card p-3 mt-3" aria-label="Chi tiết đơn hàng"></section>
    </section>
</main>
</body>
</html>
