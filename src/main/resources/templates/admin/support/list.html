<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/admin}">
<body>
<main layout:fragment="content" class="admin-content-wrapper">
  <section data-support-inbox>
    <header class="admin-page-header">
      <div><h1 class="admin-page-title">Hỗ trợ khách hàng</h1><p>Nhận và trả lời hội thoại thuộc chi nhánh của bạn.</p></div>
      <button data-support-refresh type="button" class="btn btn-outline-primary">Làm mới</button>
    </header>
    <p data-support-status role="status" aria-live="polite">Đang tải hội thoại…</p>
    <div class="support-inbox__grid">
      <aside><h2 class="h5">Hội thoại</h2><div data-support-list></div></aside>
      <section>
        <h2 data-support-title class="h6">Chọn một hội thoại để xem nội dung</h2>
        <button data-support-close type="button" class="btn btn-sm btn-outline-secondary align-self-start mb-2" hidden>Đóng hội thoại</button>
        <div data-support-detail aria-live="polite"></div>
        <form data-support-form hidden>
          <label class="visually-hidden" for="employee-support-input">Trả lời khách hàng</label>
          <textarea id="employee-support-input" maxlength="2000" required placeholder="Nhập phản hồi…"></textarea>
          <button class="btn btn-danger" type="submit"><i class="bi bi-send" aria-hidden="true"></i> Gửi</button>
        </form>
      </section>
    </div>
  </section>
</main>
<th:block layout:fragment="scripts"><script th:src="@{/js/domain/support-inbox.js}"></script></th:block>
</body>
</html>
