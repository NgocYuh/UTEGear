<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/admin}">
<head><title>Tổng quan quản trị - UTEGear</title></head>
<body>
<main layout:fragment="content" class="admin-content-wrapper" data-admin-page="dashboard">
    <header class="admin-page-header"><div class="admin-page-header-info"><h1 class="admin-page-title">Tổng quan</h1></div></header>
    <p data-admin-status role="status" aria-live="polite">Đang tải số liệu…</p>
    <section class="admin-stat-grid" aria-label="Số liệu vận hành" hidden data-admin-content>
        <article class="admin-stat-card"><div class="admin-stat-body"><strong class="admin-stat-value" data-stat="totalOrders">0</strong><span class="admin-stat-label">Tổng đơn hàng</span></div></article>
        <article class="admin-stat-card"><div class="admin-stat-body"><strong class="admin-stat-value" data-stat="pendingOrders">0</strong><span class="admin-stat-label">Đơn chờ xử lý</span></div></article>
        <article class="admin-stat-card"><div class="admin-stat-body"><strong class="admin-stat-value" data-stat="activeProducts">0</strong><span class="admin-stat-label">Sản phẩm hoạt động</span></div></article>
        <article class="admin-stat-card"><div class="admin-stat-body"><strong class="admin-stat-value" data-stat="totalStores">0</strong><span class="admin-stat-label">Cửa hàng</span></div></article>
        <article class="admin-stat-card"><div class="admin-stat-body"><strong class="admin-stat-value" data-stat="totalUsers">0</strong><span class="admin-stat-label">Tài khoản</span></div></article>
        <article class="admin-stat-card"><div class="admin-stat-body"><strong class="admin-stat-value" data-stat="totalCategories">0</strong><span class="admin-stat-label">Danh mục</span></div></article>
        <article class="admin-stat-card"><div class="admin-stat-body"><strong class="admin-stat-value" data-stat="totalBrands">0</strong><span class="admin-stat-label">Thương hiệu</span></div></article>
        <article class="admin-stat-card"><div class="admin-stat-body"><strong class="admin-stat-value" data-stat="totalCoupons">0</strong><span class="admin-stat-label">Mã giảm giá</span></div></article>
    </section>
</main>
</body>
</html>
