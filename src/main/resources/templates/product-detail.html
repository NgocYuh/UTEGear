<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}">
<head><title th:text="${product.name} + ' - UTEGear'">Sản phẩm - UTEGear</title></head><body>
<main layout:fragment="content" class="section"><section class="container" data-page="product-detail" th:data-product-id="${product.id}">
 <a href="/products">Quay lại sản phẩm</a><h1 th:text="${product.name}"></h1>
 <div class="row g-4"><div class="col-md-6">
  <img id="mainProductImage" class="img-fluid rounded" th:src="${product.images.isEmpty() ? '/images/placeholder.svg' : product.images[0].secureUrl}" th:alt="${product.name}" onerror="this.onerror=null;this.src='/images/placeholder.svg'">
  <div class="d-flex flex-wrap gap-2"><button type="button" class="btn btn-outline-primary" th:each="image : ${product.images}" th:data-gallery-url="${image.secureUrl}" th:aria-label="${image.altText != null ? image.altText : product.name}"><img th:src="${image.secureUrl}" th:alt="${image.altText}" width="64" height="64"></button></div>
 </div><div class="col-md-6">
  <p th:text="${product.category.name}"></p><p th:text="${product.brand != null ? product.brand.name : 'UTEGear'}"></p>
  <p class="price current" data-variant-price th:text="${#numbers.formatDecimal(product.effectivePrice,1,'POINT',0,'COMMA')} + ' ₫'"></p>
  <label for="detail-variant" class="form-label">Biến thể</label>
  <select id="detail-variant" class="form-select mb-3" data-detail-variant>
   <option th:each="variant : ${product.variants}" th:value="${variant.id}" th:selected="${variant.id == product.defaultVariantId}" th:data-price="${variant.effectivePrice}" th:data-stock="${variant.totalStock}" th:text="${variant.sku} + ' — ' + ${variant.optionValues}"></option>
  </select>
  <p data-variant-stock role="status" aria-live="polite"></p>
  <label for="quantity" class="form-label">Số lượng</label><input id="quantity" type="number" min="1" step="1" value="1" class="form-control mb-3">
  <button type="button" class="btn btn-utama" data-detail-add data-action="add-to-cart" th:data-product-id="${product.id}" data-quantity-target="quantity">Thêm vào giỏ</button>
  <button type="button" class="btn btn-outline-primary" data-action="toggle-wishlist" th:data-product-id="${product.id}">Yêu thích</button>
  <h2 class="h5 mt-4">Tồn kho tại cửa hàng</h2><div data-product-availability role="status" aria-live="polite">Đang tải tồn kho…</div>
 </div></div>
 <h2 class="h4 mt-4">Mô tả</h2><p th:text="${product.description}"></p>
 <h2 class="h4">Thông số kỹ thuật</h2><pre th:text="${product.specifications}" class="text-wrap"></pre>
</section></main></body></html>
