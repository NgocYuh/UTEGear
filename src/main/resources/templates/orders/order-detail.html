<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}">
<head><title>Chi tiết đơn hàng - UTEGear</title></head><body><main layout:fragment="content" class="section"><section class="container">
<h1 th:text="'Đơn hàng ' + ${order.orderCode}"></h1>
<p class="order-status-badge"><span th:text="${order.status}"></span></p>
<p data-order-realtime th:data-order-id="${order.id}" role="status" aria-live="polite"></p>
<div class="surface-card p-3 mb-3" th:each="item : ${order.items}"><h2 class="h5" th:text="${item.productName}"></h2><p th:text="${item.sku}"></p><p th:text="'Số lượng: ' + ${item.quantity}"></p><strong th:text="${#numbers.formatDecimal(item.subtotal,1,'POINT',0,'COMMA')} + ' ₫'"></strong></div>
<p>Tổng tiền: <strong th:text="${#numbers.formatDecimal(order.total,1,'POINT',0,'COMMA')} + ' ₫'"></strong></p>
<a href="/products" class="btn btn-outline-primary">Tiếp tục mua sắm</a>
</section></main></body></html>
