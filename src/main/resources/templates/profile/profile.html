<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}">
<head><title>Tài khoản - UTEGear</title></head><body>
<main layout:fragment="content" class="section">
 <section class="container" data-customer-view="profile" aria-labelledby="profile-title">
  <h1 id="profile-title">Thông tin tài khoản</h1>
  <p data-view-status role="status" aria-live="polite">Đang tải thông tin…</p>
  <noscript>Cần bật JavaScript để tải thông tin tài khoản.</noscript>
  <dl data-view-items class="surface-card p-4"></dl>
  <div data-profile-management hidden>
   <h2 class="h4">Cập nhật thông tin</h2>
   <form data-profile-form class="surface-card p-3 mb-4" onsubmit="return false">
    <label for="profile-name" class="form-label">Họ tên</label><input id="profile-name" name="fullName" minlength="2" maxlength="100" required class="form-control mb-3">
    <label for="profile-phone" class="form-label">Điện thoại</label><input id="profile-phone" name="phone" type="tel" pattern="\+?[0-9]{10,20}" maxlength="20" class="form-control mb-3">
    <button type="submit" class="btn btn-utama">Lưu thông tin</button>
   </form>
   <h2 id="addresses" class="h4">Địa chỉ giao hàng</h2><div data-address-items></div>
   <form data-address-form class="surface-card p-3 mb-4" onsubmit="return false">
    <label for="address-name" class="form-label">Người nhận</label><input id="address-name" name="fullName" maxlength="100" required class="form-control mb-3">
    <label for="address-phone" class="form-label">Điện thoại người nhận</label><input id="address-phone" name="phone" type="tel" pattern="\+?[0-9]{10,20}" maxlength="20" required class="form-control mb-3">
    <label for="address-street" class="form-label">Số nhà, tên đường</label><input id="address-street" name="street" maxlength="255" required class="form-control mb-3">
    <label for="address-ward" class="form-label">Phường/xã</label><input id="address-ward" name="ward" maxlength="100" class="form-control mb-3">
    <label for="address-district" class="form-label">Quận/huyện</label><input id="address-district" name="district" maxlength="100" class="form-control mb-3">
    <label for="address-province" class="form-label">Tỉnh/thành phố</label><input id="address-province" name="province" maxlength="100" required class="form-control mb-3">
    <label for="address-label" class="form-label">Tên địa chỉ</label><input id="address-label" name="label" maxlength="100" class="form-control mb-3">
    <button type="submit" class="btn btn-utama">Lưu địa chỉ</button><button type="button" data-address-reset class="btn btn-outline-primary">Thêm địa chỉ mới</button>
   </form>
   <h2 class="h4">Đổi mật khẩu</h2>
   <form data-password-form class="surface-card p-3" onsubmit="return false">
    <label for="password-current" class="form-label">Mật khẩu hiện tại</label><input id="password-current" type="password" name="currentPassword" autocomplete="current-password" required class="form-control mb-3">
    <label for="password-new" class="form-label">Mật khẩu mới</label><input id="password-new" type="password" name="newPassword" autocomplete="new-password" minlength="8" maxlength="72" required class="form-control mb-3">
    <label for="password-confirm" class="form-label">Xác nhận mật khẩu mới</label><input id="password-confirm" type="password" name="confirmPassword" autocomplete="new-password" required class="form-control mb-3">
    <button type="submit" class="btn btn-utama">Đổi mật khẩu</button>
   </form>
  </div>
  <a href="/login" class="btn btn-outline-primary">Đăng nhập</a>
 </section>
</main></body></html>
