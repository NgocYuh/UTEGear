<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}">
<head><title>Khôi phục mật khẩu - UTEGear</title></head>
<body>
<main layout:fragment="content" class="container py-5">
    <section class="surface-card p-4 mx-auto" style="max-width: 36rem">
        <h1 class="h3">Khôi phục mật khẩu</h1>
        <p>Hệ thống chưa cấu hình dịch vụ gửi email đặt lại mật khẩu. Để tránh hiển thị một biểu mẫu không hoạt động, chức năng tự khôi phục đang tạm khóa.</p>
        <p>Vui lòng liên hệ quản trị viên để xác minh và đặt lại mật khẩu.</p>
        <div class="d-flex gap-2 flex-wrap"><a class="btn btn-primary" th:href="@{/login}">Quay lại đăng nhập</a><a class="btn btn-outline-primary" th:href="@{/contact}">Thông tin liên hệ</a></div>
    </section>
</main>
</body>
</html>
