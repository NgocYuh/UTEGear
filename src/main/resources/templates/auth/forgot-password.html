<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}">
<head>
    <title>Khôi phục mật khẩu - UTEGear</title>
</head>
<body>

<main layout:fragment="content" class="auth-section">
    <div class="container">
        <div class="auth-card">
            <div class="auth-header">
                <span class="brand-icon"><i class="bi bi-key"></i></span>
                <h1>Khôi phục mật khẩu</h1>
                <p id="forgotSubtitle">Nhập email đăng ký để nhận mã OTP đặt lại mật khẩu</p>
            </div>

            <!-- STATUS ALERT -->
            <div id="forgotAlert" class="alert d-none" role="alert"></div>

            <!-- STEP 1: REQUEST OTP -->
            <form id="stepRequestOtpForm" class="auth-form">
                <div class="mb-4">
                    <label for="forgotEmail" class="form-label">Email tài khoản <span class="required-star">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="forgotEmail" name="email" placeholder="name@domain.com" required autocomplete="email">
                    </div>
                    <div class="form-text text-muted fs-8">Hệ thống sẽ gửi một mã OTP 6 chữ số đến địa chỉ email này.</div>
                </div>

                <button type="submit" id="btnSendOtp" class="btn btn-utama btn-lg w-100">
                    GỬI MÃ OTP <i class="bi bi-arrow-right ms-1"></i>
                </button>
            </form>

            <!-- STEP 2: VERIFY OTP & RESET PASSWORD -->
            <form id="stepResetPasswordForm" class="auth-form d-none">
                <div class="mb-3">
                    <label for="resetEmail" class="form-label">Email tài khoản</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="resetEmail" name="email" readonly>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="resetOtpCode" class="form-label">Mã OTP (6 chữ số) <span class="required-star">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                        <input type="text" class="form-control text-center fs-4 letter-spacing-2" id="resetOtpCode" name="otpCode"
                               placeholder="123456" maxlength="6" pattern="[0-9]{6}" required inputmode="numeric" autocomplete="one-time-code">
                    </div>
                    <div class="form-text text-muted fs-8">Mã có hiệu lực trong vòng 10 phút.</div>
                </div>

                <div class="mb-3">
                    <label for="newPassword" class="form-label">Mật khẩu mới <span class="required-star">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="newPassword" name="newPassword" minlength="8" maxlength="72"
                               placeholder="Tối thiểu 8 ký tự" required autocomplete="new-password">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="confirmNewPassword" class="form-label">Xác nhận mật khẩu mới <span class="required-star">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                        <input type="password" class="form-control" id="confirmNewPassword" name="confirmNewPassword"
                               placeholder="Nhập lại mật khẩu mới" required autocomplete="new-password">
                    </div>
                </div>

                <button type="submit" id="btnSubmitReset" class="btn btn-utama btn-lg w-100 mb-3">
                    ĐẶT LẠI MẬT KHẨU <i class="bi bi-check-circle ms-1"></i>
                </button>

                <div class="d-flex justify-content-between align-items-center">
                    <button type="button" id="btnBackToStep1" class="btn btn-link text-decoration-none p-0 fs-7">
                        <i class="bi bi-chevron-left me-1"></i>Nhập email khác
                    </button>
                    <button type="button" id="btnResendResetOtp" class="btn btn-link text-decoration-none p-0 fs-7">
                        <i class="bi bi-arrow-repeat me-1"></i>Gửi lại mã OTP <span id="resetCountdownText"></span>
                    </button>
                </div>
            </form>

            <div class="auth-footer mt-4">
                <p class="mb-0">Nhớ lại mật khẩu? <a href="/login">Đăng nhập</a></p>
            </div>
        </div>
    </div>
</main>

</body>
</html>
