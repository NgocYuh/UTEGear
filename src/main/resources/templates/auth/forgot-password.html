<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}">
<head>
    <title>Quên mật khẩu - UTEGear</title>
</head>
<body>

<main layout:fragment="content" class="auth-section">
    <div class="container">
        <div class="auth-card">
            <div class="auth-header">
                <span class="brand-icon"><i class="bi bi-key"></i></span>
                <h1>Quên mật khẩu</h1>
                <p>Nhập email tài khoản để nhận liên kết khôi phục mật khẩu</p>
            </div>
            <form th:action="@{/forgot-password}" method="post" class="auth-form">
                <div class="mb-4">
                    <label for="email" class="form-label">Email tài khoản <span class="required-star">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="name@domain.com" required autocomplete="email">
                    </div>
                </div>
                <button type="submit" class="btn btn-utama btn-lg w-100">
                    GỬI YÊU CẦU KHÔI PHÚC <i class="bi bi-send ms-1"></i>
                </button>
            </form>
            <div class="auth-footer text-center">
                <p class="mb-0"><a href="/login" class="text-decoration-none"><i class="bi bi-arrow-left"></i> Quay lại trang Đăng nhập</a></p>
            </div>
        </div>
    </div>
</main>

</body>
</html>
