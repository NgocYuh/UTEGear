<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' - UTEGear' : 'UTEGear - Gear up. Game on.'}">UTEGear - Gear up. Game on.</title>
    <meta name="description" content="UTEGear - Cửa hàng phụ kiện gaming và công nghệ chính hãng hàng đầu Việt Nam. Bàn phím cơ, chuột gaming, tai nghe eSports chính hãng.">
    
    <!-- OpenGraph Meta Tags -->
    <meta property="og:title" th:content="${pageTitle != null ? pageTitle + ' - UTEGear' : 'UTEGear - Gear up. Game on.'}">
    <meta property="og:description" content="Khám phá bàn phím cơ, chuột gaming, tai nghe eSports chính hãng giá tốt tại UTEGear.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="UTEGear">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="shortcut icon" th:href="@{/favicon.ico}">

    <!-- Fonts & Bootstrap CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Unified Master CSS Entry -->
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

    <!-- Header Fragment -->
    <th:block th:insert="~{fragments/header :: header}"></th:block>

    <!-- Main Dynamic Content Body -->
    <main layout:fragment="content"></main>

    <!-- Footer Fragment -->
    <th:block th:insert="~{fragments/footer :: footer}"></th:block>

    <!-- Global Toast Container -->
    <th:block th:insert="~{fragments/header :: toastArea}"></th:block>
    <th:block th:insert="~{fragments/support-chat :: widget}"></th:block>

    <!-- Quick View Modal Container -->
    <div class="modal fade" id="quickViewModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content" id="quickViewContent">
                <!-- Dynamic Quick View Rendered Here -->
            </div>
        </div>
    </div>

    <!-- Scripts Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
    <script th:src="@{/js/core/utils.js}"></script>
    <script th:src="@{/js/core/api.js}"></script>
    <script th:src="@{/js/components/toast.js}"></script>
    <script th:src="@{/js/components/autocomplete.js}"></script>
    <script th:src="@{/js/domain/cart.js}"></script>
    <script th:src="@{/js/domain/wishlist.js}"></script>
    <script th:src="@{/js/domain/variant.js}"></script>
    <script th:src="@{/js/domain/filter.js}"></script>
    <script th:src="@{/js/app.js}"></script>
    <script th:src="@{/js/domain/views.js}"></script>
    <script th:src="@{/js/components/account-menu.js}"></script>
    <script th:src="@{/js/domain/account.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script th:src="@{/js/domain/realtime.js}"></script>
    <script th:src="@{/js/domain/realtime-ui.js}"></script>
    <script th:src="@{/js/domain/admin.js}"></script>
    <script th:src="@{/js/domain/orders.js}"></script>
    <script th:src="@{/js/domain/support-chat.js}"></script>

    <!-- Additional Inline Page Scripts -->
    <th:block layout:fragment="scripts"></th:block>
</body>
</html>
