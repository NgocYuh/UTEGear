<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="main(title, content)">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title + ' — UTEGear'}">UTEGear</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/components/toast.js}"></script>
  <script defer th:src="@{/js/components/pagination.js}"></script>
  <script defer th:src="@{/js/core/mock-data.js}"></script>
  <script defer th:src="@{/js/app.js}"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Chuyển đến nội dung</a>
  <header th:replace="~{fragments/header :: header}"></header>
  <main id="main-content" class="site-container ui-main" tabindex="-1">
    <th:block th:replace="${content}"></th:block>
  </main>
  <footer th:replace="~{fragments/footer :: footer}"></footer>
  <div th:replace="~{fragments/toastArea :: toastArea}"></div>
</body>
</html>
