<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' - UTEGear Admin' : 'Quản trị hệ thống - UTEGear'}">Quản trị hệ thống - UTEGear</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">

    <!-- Fonts & Bootstrap CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Unified Master CSS Entry -->
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="admin-body">

<div class="admin-layout">
    <!-- Admin Sidebar Backdrop for Mobile -->
    <div class="admin-sidebar-backdrop" onclick="toggleAdminSidebar()" aria-hidden="true"></div>

    <!-- Admin Sidebar Fragment -->
    <th:block th:insert="~{admin/fragments/sidebar :: sidebar}"></th:block>

    <!-- Admin Main Wrapper -->
    <div class="admin-main">
        <!-- Top Navbar for Mobile Toggle & Admin User Info -->
        <header class="admin-topbar">
            <div class="admin-topbar-left">
                <button type="button" class="btn btn-sm btn-ghost d-lg-none" onclick="toggleAdminSidebar()" aria-label="Mở danh mục quản trị">
                    <i class="bi bi-list fs-4"></i>
                </button>
                <span class="d-none d-md-inline-block text-muted fs-8 font-bold text-uppercase tracking-wider">
                    UTEGear Operations Center
                </span>
            </div>
            <div class="admin-topbar-right">
                <a th:href="@{/}" class="btn btn-sm btn-admin-secondary" target="_blank">
                    <i class="bi bi-box-arrow-up-right"></i>
                    <span class="d-none d-sm-inline">Xem cửa hàng</span>
                </a>
                <span class="admin-user-pill">
                    <i class="bi bi-person-circle text-primary"></i>
                    <span th:text="${currentUser != null ? currentUser.fullName : 'Quản trị viên'}">Admin</span>
                </span>
            </div>
        </header>

        <!-- Main Dynamic Content -->
        <main layout:fragment="content" class="admin-content-wrapper"></main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>

<!-- WebSocket (SockJS + STOMP) & UTEGear modules -->
<script src="/webjars/sockjs-client/1.5.1/sockjs.min.js"></script>
<script src="/webjars/stomp-websocket/2.3.4/stomp.min.js"></script>
<script th:src="@{/js/core/utils.js}"></script>
<script th:src="@{/js/components/toast.js}"></script>

<script>
    // Nhiệm vụ 3: Realtime — thông báo đơn hàng mới cho Admin
    // Realtime WebSocket channel: Subscribe to new order notifications
    (function () {
        function connectAdminOrders() {
            try {
                var socket = new SockJS('/ws');
                var stompClient = Stomp.over(socket);
                stompClient.connect({}, function () {
                    stompClient.subscribe('/topic/admin/orders', function (frame) {
                        try {
                            var data = JSON.parse(frame.body);
                            var code = data.orderCode || '...';
                            if (window.UTEGear && UTEGear.Toast) {
                                UTEGear.Toast.show('\uD83D\uDD14 Có đơn hàng mới ' + code + '!', 'info');
                            }
                        } catch (e) { /* ignore malformed frame */ }
                    });
                }, function () {
                    // Re-connect on failure after a short delay
                    setTimeout(connectAdminOrders, 5000);
                });
            } catch (e) { /* socket libs may be unavailable; ignore */ }
        }
        document.addEventListener('DOMContentLoaded', connectAdminOrders);
    })();

    function toggleAdminSidebar() {
        const sidebar = document.querySelector('.admin-sidebar');
        const backdrop = document.querySelector('.admin-sidebar-backdrop');
        if (sidebar) sidebar.classList.toggle('show');
        if (backdrop) backdrop.classList.toggle('show');
    }
</script>
<th:block layout:fragment="scripts"></th:block>

</body>
</html>
