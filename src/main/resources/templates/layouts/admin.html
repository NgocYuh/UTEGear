<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' - UTEGear Admin' : 'Quản trị hệ thống - UTEGear'}">Quản trị hệ thống - UTEGear</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">

    <!-- Fonts & Bootstrap CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Unified Master CSS Entry -->
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="admin-body" data-admin-session-guard hidden aria-busy="true">

<div class="admin-layout">
    <!-- Admin Sidebar Backdrop for Mobile -->
    <div class="admin-sidebar-backdrop" onclick="toggleAdminSidebar()" aria-hidden="true"></div>

    <!-- Admin Sidebar Fragment -->
    <th:block th:insert="~{admin/fragments/sidebar :: sidebar}"></th:block>

    <!-- Admin Main Wrapper -->
    <div class="admin-main">
        <!-- Top Navbar for Mobile Toggle & Admin User Info -->
        <header class="admin-topbar">
            <div class="admin-topbar-left">
                <button type="button" class="btn btn-sm btn-ghost d-lg-none" onclick="toggleAdminSidebar()" aria-label="Mở danh mục quản trị">
                    <i class="bi bi-list fs-4"></i>
                </button>
                <span class="d-none d-md-inline-block text-muted fs-8 font-bold text-uppercase tracking-wider">
                    UTEGear Operations Center
                </span>
            </div>
            <div class="admin-topbar-right">
                <a th:href="@{/}" class="btn btn-sm btn-admin-secondary">
                    <i class="bi bi-shop"></i>
                    <span class="d-none d-sm-inline">Xem cửa hàng</span>
                </a>
                <span class="admin-user-pill">
                    <i class="bi bi-person-circle text-primary"></i>
                    <span data-session-name>Quản trị viên</span>
                </span>
            </div>
        </header>

        <!-- Main Dynamic Content -->
        <main layout:fragment="content" class="admin-content-wrapper"></main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>

<script th:src="@{/js/core/api.js}"></script>
<script th:src="@{/js/core/utils.js}"></script>
<script th:src="@{/js/components/toast.js}"></script>
<script th:src="@{/js/domain/admin.js}"></script>
<script th:src="@{/js/domain/cart.js}"></script>
<script th:src="@{/js/domain/wishlist.js}"></script>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/domain/views.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script th:src="@{/js/domain/realtime.js}"></script>
<script th:src="@{/js/domain/realtime-ui.js}"></script>
<script th:src="@{/js/domain/orders.js}"></script>
<script th:src="@{/js/domain/admin-pages.js}"></script>
<script>function toggleAdminSidebar(){document.querySelector(".admin-sidebar")?.classList.toggle("show");document.querySelector(".admin-sidebar-backdrop")?.classList.toggle("show");}</script>
<th:block layout:fragment="scripts"></th:block>

</body>
</html>
