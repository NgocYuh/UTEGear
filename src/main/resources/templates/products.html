<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}">
<head><title>Sản phẩm - UTEGear</title></head><body>
<main layout:fragment="content" class="section"><section class="container">
 <h1>Tất cả sản phẩm</h1>
 <form action="/products" method="get" class="surface-card p-3 mb-4 row g-3">
  <div class="col-md-4"><label for="catalog-q" class="form-label">Tìm kiếm</label><input id="catalog-q" name="q" th:value="${keyword}" class="form-control"></div>
  <div class="col-md-4"><label for="catalog-category" class="form-label">Danh mục</label><select id="catalog-category" name="categoryId" class="form-select"><option value="">Tất cả</option><option th:each="category : ${allCategories}" th:value="${category.id}" th:selected="${category.id == selectedCategoryId}" th:text="${category.name}"></option></select></div>
  <div class="col-md-4"><label for="catalog-brand" class="form-label">Thương hiệu</label><select id="catalog-brand" name="brandId" class="form-select"><option value="">Tất cả</option><option th:each="brand : ${allBrands}" th:value="${brand.id}" th:selected="${brand.id == selectedBrandId}" th:text="${brand.name}"></option></select></div>
  <div class="col-md-4"><label for="catalog-min" class="form-label">Giá tối thiểu</label><input id="catalog-min" name="minPrice" type="number" min="0" th:value="${selectedMinPrice}" class="form-control"></div>
  <div class="col-md-4"><label for="catalog-max" class="form-label">Giá tối đa</label><input id="catalog-max" name="maxPrice" type="number" min="0" th:value="${selectedMaxPrice}" class="form-control"></div>
  <div class="col-md-4"><label for="catalog-sort" class="form-label">Sắp xếp</label><select id="catalog-sort" name="sort" class="form-select"><option value="createdAt,desc" th:selected="${sort == 'createdAt,desc'}">Mới nhất</option><option value="effectivePrice,asc" th:selected="${sort == 'effectivePrice,asc'}">Giá tăng dần</option><option value="effectivePrice,desc" th:selected="${sort == 'effectivePrice,desc'}">Giá giảm dần</option><option value="name,asc" th:selected="${sort == 'name,asc'}">Tên A–Z</option></select></div>
  <div class="col-md-4 d-flex align-items-end"><div class="form-check mb-2"><input id="catalog-on-sale" name="onSale" value="true" type="checkbox" class="form-check-input" th:checked="${selectedOnSale == true}"><label for="catalog-on-sale" class="form-check-label">Chỉ sản phẩm đang giảm giá</label></div></div>
  <div><button class="btn btn-utama" type="submit">Áp dụng bộ lọc</button> <a href="/products" class="btn btn-outline-primary">Xóa bộ lọc</a></div>
 </form>
 <p th:text="${products.totalElements} + ' sản phẩm'"></p>
 <p class="surface-card p-4" th:if="${products.empty}">Không tìm thấy sản phẩm phù hợp.</p>
 <div class="product-grid"><th:block th:each="p : ${products.content}"><div th:replace="~{fragments/product-card :: productCard(${p})}"></div></th:block></div>
 <nav th:if="${products.totalPages > 1}" aria-label="Phân trang sản phẩm" class="catalog-pagination my-4">
  <ul class="pagination catalog-pagination-list">
   <li class="page-item" th:classappend="${products.first} ? 'disabled'">
    <span th:if="${products.first}" class="page-link pagination-label" aria-disabled="true">Trước</span>
    <a th:unless="${products.first}" class="page-link pagination-label" rel="prev"
       th:href="@{/products(q=${keyword},categoryId=${selectedCategoryId},brandId=${selectedBrandId},minPrice=${selectedMinPrice},maxPrice=${selectedMaxPrice},onSale=${selectedOnSale},sort=${sort},page=${products.page - 1})}">Trước</a>
   </li>

   <li class="page-item" th:classappend="${products.page == 0} ? 'active'">
    <a class="page-link" th:aria-current="${products.page == 0} ? 'page'"
       th:href="@{/products(q=${keyword},categoryId=${selectedCategoryId},brandId=${selectedBrandId},minPrice=${selectedMinPrice},maxPrice=${selectedMaxPrice},onSale=${selectedOnSale},sort=${sort},page=0)}">1</a>
   </li>

   <li class="pagination-ellipsis" th:if="${products.page > 2}" aria-hidden="true">…</li>

   <th:block th:if="${products.totalPages > 2}">
    <li class="page-item"
        th:each="i : ${#numbers.sequence(1, products.totalPages - 2)}"
        th:if="${i >= products.page - 1 && i <= products.page + 1}"
        th:classappend="${i == products.page} ? 'active'">
     <a class="page-link" th:text="${i + 1}"
        th:aria-current="${i == products.page} ? 'page'"
        th:href="@{/products(q=${keyword},categoryId=${selectedCategoryId},brandId=${selectedBrandId},minPrice=${selectedMinPrice},maxPrice=${selectedMaxPrice},onSale=${selectedOnSale},sort=${sort},page=${i})}">2</a>
    </li>
   </th:block>

   <li class="pagination-ellipsis" th:if="${products.page < products.totalPages - 3}" aria-hidden="true">…</li>

   <li class="page-item" th:classappend="${products.page == products.totalPages - 1} ? 'active'">
    <a class="page-link" th:text="${products.totalPages}"
       th:aria-current="${products.page == products.totalPages - 1} ? 'page'"
       th:href="@{/products(q=${keyword},categoryId=${selectedCategoryId},brandId=${selectedBrandId},minPrice=${selectedMinPrice},maxPrice=${selectedMaxPrice},onSale=${selectedOnSale},sort=${sort},page=${products.totalPages - 1})}">2</a>
   </li>

   <li class="page-item" th:classappend="${products.last} ? 'disabled'">
    <span th:if="${products.last}" class="page-link pagination-label" aria-disabled="true">Sau</span>
    <a th:unless="${products.last}" class="page-link pagination-label" rel="next"
       th:href="@{/products(q=${keyword},categoryId=${selectedCategoryId},brandId=${selectedBrandId},minPrice=${selectedMinPrice},maxPrice=${selectedMaxPrice},onSale=${selectedOnSale},sort=${sort},page=${products.page + 1})}">Sau</a>
   </li>
  </ul>
 </nav>
</section></main></body></html>
