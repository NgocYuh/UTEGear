<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}">
<head><title>Giỏ hàng - UTEGear</title></head><body>
<main layout:fragment="content" class="section">
 <section class="container" data-customer-view="cart" aria-labelledby="cart-title">
  <h1 id="cart-title">Giỏ hàng của bạn</h1>
  <p data-view-status role="status" aria-live="polite">Đang tải giỏ hàng…</p>
  <noscript>Cần bật JavaScript để tải giỏ hàng.</noscript>
  <div data-view-items></div>
  <p>Tạm tính: <strong data-view-total>—</strong></p>
  <div data-view-actions class="d-flex flex-wrap gap-2"></div>
  <a href="/products" class="btn btn-outline-primary mt-3">Tiếp tục mua sắm</a>
  <a href="/login" class="btn btn-outline-primary mt-3">Đăng nhập</a>
 </section>
</main></body></html>
